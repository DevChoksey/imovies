version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: imovies-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=imovies_db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imovies-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/imovies_db
      - JWT_SECRET=imovies_jwt_super_secret_key_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imovies-frontend
    restart: always
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo-data:
